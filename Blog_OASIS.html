<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog OASIS</title>
    <style>
        *{ box-sizing:border-box; }
        body{ margin:0; }
        header.site{
            display:flex; align-items:center; gap:16px;
            padding:18px 22px; flex-wrap:wrap;
        }
        header.site .titulos{ flex:1; min-width:220px; }
        header.site h1{ margin:0; }
        main{ max-width:920px; margin:26px auto; padding:0 16px 40px; }
        .volver{ text-align:center; margin:26px 0 8px; }
        .tarjeta .ilustracion{ display:block; height:180px; width:auto; max-width:100%; object-fit:contain; margin:0 auto 18px; }
        .tarjeta p{ margin:0 0 14px; }
        .tarjeta p:last-child{ margin-bottom:0; }
        .tarjeta{ text-align:center; }
        .tarjeta .lead{ max-width:44em; margin-left:auto; margin-right:auto; text-align:left; }
        .acciones{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
    </style>
    <link rel="stylesheet" href="identidad.css">
</head>
<body>
<header class="site">
  <img class="site-logo" src="logo-ladh.png" alt="Logo de Psicología a Distancia LAD-H, UNRC">
  <div class="titulos"><h1>Blog OASIS</h1></div>
  <img class="site-mascot" src="albatros-saludo.png" alt="Albatros mascota de la UNRC saludando">
</header>
<main>
    <article class="tarjeta">
        <img class="ilustracion" src="profesora-megafono.png" alt="Imagen del Blog OASIS">
        <p class="lead">Este espacio es un lugar de expresión para la comunidad educativa. Da clic en el botón entrar para acceder al blog.</p>
        <div class="acciones">
            <a href="https://urcoasis.blogspot.com/2025/05/onsejos-para-crear-una-infografia.html" target="_blank" class="button">Entrar</a>
            <a href="index.html" class="button secundario">Regresar</a>
        </div>
    </article>
</main>
<script src="reveal.js"></script>
</body>
</html>
