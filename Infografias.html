<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infografías</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #800020;
            color: white;
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
        }
        main {
            margin: 20px auto;
            width: 80%;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }
        .main-image {
            max-width: 50%;
        }
        .folder-image {
            max-width: 25%;
            float: left;
            margin-right: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        td {
            vertical-align: top;
            padding: 10px;
            text-align: left;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #800020;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1em;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #555555;
        }
        .title {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Infografías</h1>
    </header>
    <main>
        <img src="infografia.jpg" alt="Imagen de Infografías" class="main-image">
        <table>
            <tr>
                <td colspan="2">
                    <a href="https://drive.google.com/drive/folders/1Aj4fE2s8BnAtwSxToK6LGLyZSD23KYcy?usp=sharing" target="_blank">
                        <img src="infografias_adrian.jpg" alt="Imagen de Infografías del Profe Adrian" class="folder-image">
                    </a>
                    <p class="title">Infografías Profe Adrian</p>
                    <p>
                        En este espacio el profe Adrian te comparte sus infografías para tu estudio.
                    </p>
                </td>
            </tr>
        </table>
        <a href="index.html" class="button">Regresar</a>
    </main>
</body>
</html>
