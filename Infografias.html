<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infografías</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header.site {
            display: flex; align-items: center; gap: 16px;
            padding: 18px 22px; flex-wrap: wrap;
            text-align: left;
        }
        header.site .titulos { flex: 1; min-width: 220px; }
        header.site h1 { margin: 0; }
        main {
            margin: 24px auto;
            width: 88%;
            max-width: 900px;
        }
        .main-image {
            max-width: 50%;
            height: auto;
            margin: 8px 0 20px;
        }
        .tarjeta {
            text-align: left;
            overflow: hidden;
        }
        .folder-image {
            max-width: 25%;
            height: auto;
            float: left;
            margin: 0 16px 8px 0;
        }
        .tarjeta .title {
            font-weight: bold;
            color: var(--vino);
            font-size: 1.1rem;
            margin-top: 0;
        }
        .button { margin-top: 20px; }
        @media (max-width: 700px) {
            .main-image { max-width: 75%; }
            .folder-image { max-width: 40%; }
        }
    </style>
    <link rel="stylesheet" href="identidad.css">
</head>
<body>
    <header class="site">
        <img class="site-logo" src="logo-ladh.png" alt="Logo de Psicología a Distancia LAD-H, UNRC">
        <div class="titulos"><h1>Infografías</h1></div>
        <img class="site-mascot" src="profe-lee.png" alt="Albatros profesor leyendo un libro">
    </header>
    <main>
        <img src="profe-lee.png" alt="Albatros profesor leyendo un libro" class="main-image">
        <article class="tarjeta">
            <a href="https://drive.google.com/drive/folders/1Aj4fE2s8BnAtwSxToK6LGLyZSD23KYcy?usp=sharing" target="_blank">
                <img src="profesora-escribe.png" alt="Albatros profesora escribiendo en su libreta" class="folder-image">
            </a>
            <p class="title">Infografías Profe Adrian</p>
            <p>
                En este espacio el profe Adrian te comparte sus infografías para tu estudio.
            </p>
        </article>
        <a href="index.html" class="button">Regresar</a>
    </main>
<script src="reveal.js"></script>
</body>
</html>
