<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guías de Estudio</title>
    <style>
        *{ box-sizing:border-box; }
        body{ margin:0; }
        header.site{
            display:flex; align-items:center; gap:16px;
            padding:18px 22px; flex-wrap:wrap;
        }
        header.site .titulos{ flex:1; min-width:220px; }
        header.site h1{ margin:0; }
        main{ max-width:920px; margin:28px auto; padding:0 16px 40px; }
        .hero-img{
            display:block; margin:0 auto 26px;
            width:260px; max-width:70%; height:auto;
        }
        a.tarjeta{
            display:flex; align-items:center; gap:16px;
            text-decoration:none; color:var(--tinta);
            font-size:1.15rem; font-weight:700;
            transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        a.tarjeta:hover{
            transform:translateY(-3px); box-shadow:var(--sombra);
            border-color:var(--dorado); color:var(--tinta);
        }
        a.tarjeta .flecha{
            margin-left:auto; flex:none;
            color:var(--dorado-oscuro); font-size:1.3rem; font-weight:700;
        }
        .volver{ display:inline-block; margin-top:24px; }
        footer{ padding:16px; text-align:center; font-size:.9em; }
        @media (max-width:700px){
            a.tarjeta{ font-size:1.02rem; padding:20px 18px; }
        }
    </style>
    <link rel="stylesheet" href="identidad.css">
</head>
<body>
    <header class="site">
        <img class="site-logo" src="logo-ladh.png" alt="Logo de Psicología a Distancia LAD-H, UNRC">
        <div class="titulos"><h1>Guías de Estudio</h1></div>
        <img class="site-mascot" src="albatros-saludo.png" alt="Albatros mascota de la UNRC">
    </header>
    <main>
        <img class="hero-img" src="alb-est-subraya.png" alt="Guías de Estudio">
        <a href="Examen_diversidad.html" class="tarjeta">Guía Diversidad e Inclusión Educativa<span class="flecha" aria-hidden="true">→</span></a>
        <p><a href="index.html" class="volver">← Volver</a></p>
    </main>
    <footer>
        <strong>Proyecto Oasis Psique | URC</strong>
    </footer>
    <script src="reveal.js"></script>
</body>
</html>
