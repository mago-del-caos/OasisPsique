<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #800020;
            color: white;
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
        }
        td {
            padding: 10px;
            vertical-align: top;
            text-align: left;
        }
        img {
            max-width: 150px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #800020;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1em;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #555555;
        }
    </style>
    <link rel="stylesheet" href="identidad.css">
</head>
<body>
    
<header>
        <img src="logo-ladh.png" alt="Logo de Psicología a Distancia LAD-H, UNRC" class="site-logo">
    <h1 style="font-size: 2em;">Biblioteca Digital</h1>
</header>
<img src="profesora-lee.png" alt="Biblioteca Digital" style="display: block; margin: 0 auto; width: 25%;">
    <main>
        <table>
            <tr>
                <td>
                    <a href="https://drive.google.com/drive/folders/1AMR1ZRoNzKm3g7TCG6MdLKPs2MJmffoG?usp=sharing" target="_blank">
                        <img src="profe-lee.png" alt="Libros de Psicología">
                    </a>
                </td>
                <td>Esta biblioteca tiene una compilación de libros de psicología.</td>
            </tr>
            <tr>
                <td>
                    <a href="https://drive.google.com/drive/folders/1XD2EKIeSxBh2nB5aRDpghxO47I4HGAGC?usp=drive_link" target="_blank">
                        <img src="albatros-piensa.png" alt="Libros de Filosofía">
                    </a>
                </td>
                <td>Esta página posee una colección de libros de filosofía.</td>
            </tr>
            <tr>
                <td>
                    <a href="https://drive.google.com/drive/folders/1-l-aJNdKR8PFmiPxZN3lZYqonPMH1Fp1?usp=sharing" target="_blank">
                        <img src="albatros-presenta.png" alt="Libros de varios temas">
                    </a>
                </td>
                <td>Este recurso posee libros de diferentes temas para tu estudio.</td>
            </tr>
        </table>
        <a href="index.html" class="button">Volver</a>
    </main>
</body>
</html>
