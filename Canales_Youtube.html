<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canales de Youtube</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #800020;
            color: white;
            padding: 20px 0;
        }
        header h1 {
            margin: 0;
        }
        main {
            margin: 20px auto;
            width: 80%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        td {
            vertical-align: top;
            padding: 10px;
            text-align: left;
        }
        iframe {
            width: 100%;
            max-width: 560px;
            height: 315px;
            border: none;
            border-radius: 10px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        .button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #800020;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1em;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #555555;
        }
        .title {
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="identidad.css">
</head>
<body>
    <header>
        <img src="logo-ladh.png" alt="Logo de Psicología a Distancia LAD-H, UNRC" class="site-logo">
        <h1>Canales de Youtube</h1>
    </header>
    <main>
        <table>
            <tr>
                <td>
                    <iframe src="https://www.youtube.com/embed/mb5qnOSqWjo?si=2gCa6mSG0JZ7_bCN" allowfullscreen></iframe>
                </td>
                <td>
                    <p class="title">URC epistemología y psicología</p>
                    <p>
                        Este canal pertenece al profe Adrian y sube sus sesiones, material de apoyo, cursos y conferencias.
                    </p>
                </td>
            </tr>
        </table>
        <a href="index.html" class="button">Regresar</a>
    </main>
</body>
</html>
